<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - Shop Ledger</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #eef3f9;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow:
                0 12px 35px
                rgba(0,0,0,0.12);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: #2563eb;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            margin: 0;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin: 8px 0 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
        }

        .link {
            text-align: center;
            margin-top: 22px;
        }

        .link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

    </style>

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            SL
        </div>

        <h1>
            Create Account
        </h1>

        <div class="subtitle">
            Shop Ledger
        </div>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('signup') }}"
        >

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    minlength="3"
                    autocomplete="username"
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    minlength="6"
                    autocomplete="new-password"
                >

            </div>


            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    required
                    minlength="6"
                    autocomplete="new-password"
                >

            </div>


            <button type="submit">
                Sign Up
            </button>

        </form>


        <div class="link">

            Already have an account?

            <a href="{{ url_for('signin') }}">
                Sign In
            </a>

        </div>

    </div>

</div>

</body>

</html>
